<style>

tr{transition:background .15s}tbody tr:hover,.row:hover{background:var(--soft)}
}

</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<script>
const KEY='placedesk-v1',DEPTS=['CSE','IT','ECE','Mechanical','Civil','MBA'],AST=['Applied','Shortlisted','Interview','Offered','Rejected'],DST=['Upcoming','Ongoing','Completed'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const elig=(s,d)=>s.cgpa>=d.minCgpa&&(!d.depts||/all/i.test(d.depts)||d.depts.split(',').map(x=>x.trim().toLowerCase()).includes(s.dept.toLowerCase()));
function seed(){let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 const fn='Aarav Diya Rohan Ananya Vivaan Isha Kabir Meera Arjun Sana Neel Priya Yash Tara Dev Riya Aditya Kavya Harsh Nisha Karan Pooja Manav Simran'.split(' '),ln='Sharma Patel Verma Joshi Mehta Singh Gupta Nair Iyer Khan Das Reddy'.split(' '),sk=['Java','Python','React','SQL','AutoCAD','Embedded C','Excel','Finance','Node.js','Cloud'];
 const students=fn.map((n,i)=>({id:'s'+i,name:n+' '+ln[Math.floor(rnd()*12)],roll:'22'+DEPTS[i%6].slice(0,2).toUpperCase()+(100+i),dept:DEPTS[i%6],cgpa:+(6+rnd()*3.8).toFixed(1),email:n.toLowerCase()+'@campus.edu',phone:'98'+Math.floor(1e7+rnd()*8.9e7),skills:sk[i%10]+', '+sk[(i+3)%10]}));
 const drives=[['Infosys','Systems Engineer',6.5,'2026-11-02',6,'CSE, IT, ECE','Pune','Completed'],['TCS','Digital Analyst',7,iso(-4),7,'CSE, IT','Remote','Completed'],['Bosch','Design Engineer',9.5,iso(3),6.5,'ECE, Mechanical','Bengaluru','Ongoing'],['Deloitte','Business Analyst',12,iso(6),7.5,'All','Mumbai','Upcoming'],['L&T','Site Engineer',7.5,iso(10),6,'Civil, Mechanical','Vadodara','Upcoming'],['Razorpay','Software Engineer',22,iso(14),8,'CSE, IT','Bengaluru','Upcoming']].map((x,i)=>({id:'d'+i,name:x[0],role:x[1],ctc:x[2],date:x[3],minCgpa:x[4],depts:x[5],location:x[6],status:x[7]}));
 drives[0].date=iso(-20);const apps=[],ints=[];
 students.forEach(s=>drives.forEach(d=>{if(elig(s,d)&&rnd()<.45){const q=rnd(),st=d.status==='Upcoming'?'Applied':q<.3?'Offered':q<.5?'Rejected':q<.75?'Shortlisted':'Interview';const a={id:uid('a'),sid:s.id,did:d.id,status:st};apps.push(a);if(st==='Interview'||(st==='Shortlisted'&&d.status!=='Completed'))ints.push({id:uid('i'),aid:a.id,date:iso(1+Math.floor(rnd()*9)),time:['10:00','11:30','14:00','15:30'][Math.floor(rnd()*4)],mode:rnd()<.5?'Online':'On campus'})}}));
 return{students,drives,apps,ints}}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
let db=load();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const ui={go:true,v:'dash',q:'',dept:'',st:'',drv:'',ast:''};
const S=id=>db.students.find(s=>s.id===id),D=id=>db.drives.find(d=>d.id===id),A=id=>db.apps.find(a=>a.id===id);
const offers=sid=>db.apps.filter(a=>a.sid===sid&&a.status==='Offered');
const best=sid=>{const o=offers(sid).map(a=>D(a.did)).filter(Boolean);return o.sort((x,y)=>y.ctc-x.ctc)[0]};
const placed=()=>db.students.filter(s=>best(s.id));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=n=>(+n).toFixed(1);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360,ini=n=>String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=n=>`<span class="av" style="background:linear-gradient(135deg,hsl(${hue(n)} 55% 40%),hsl(${(hue(n)+45)%360} 60% 55%))">${esc(ini(n))}</span>`;
const lg=n=>`<span class="lg" style="background:hsl(${hue(n)} 50% 93%);color:hsl(${hue(n)} 65% 30%);border-color:hsl(${hue(n)} 40% 78%)">${esc(String(n||'?')[0])}</span>`;
const ic=p=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${p}"/></svg>`;
const IC={dash:ic('M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z'),students:ic('M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'),drives:ic('M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4'),apps:ic('M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5'),ints:ic('M3 5h18v16H3zM3 10h18M8 3v4M16 3v4'),reports:ic('M4 20V10M10 20V4M16 20v-7M22 20H2'),reset:ic('M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5')};
const tag=(t,c='')=>`<span class="tag ${c}">${esc(t)}</span>`;
const stc=s=>({Offered:'',Rejected:'bad',Interview:'warn',Shortlisted:'warn',Applied:'mute',Completed:'mute',Ongoing:'',Upcoming:'warn'}[s]||'');
function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
/* modal */
function modal(title,fields,vals,onSave,okLabel='Save'){const o=document.createElement('div');o.className='ov';
 const inp=([k,l,t,opt,req])=>{const v=esc(vals[k]??'');const a=req?' required':'';
  if(t==='select')return`<label>${l}<select name="${k}"${a}>${opt.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}"${val==vals[k]?' selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
  return`<label>${l}<input name="${k}" type="${t||'text'}" value="${v}"${a}${t==='number'?' step="0.1"':''}></label>`};
 o.innerHTML=`<form class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${fields.map(inp).join('')}<div class="acts"><button class="btn pri" type="submit">${okLabel}</button><button class="btn" type="button" data-x>Cancel</button></div></form>`;
 document.body.appendChild(o);o.querySelector('input,select')?.focus();
 const close=()=>o.remove();o.querySelector('[data-x]').onclick=close;o.onclick=e=>{if(e.target===o)close()};
 o.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(onSave(d)!==false){close();save();render()}};
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}})}
const ask=(msg,fn,ok='Delete')=>modal(esc(msg),[],{},()=>{fn()},ok);
/* forms */
function studentForm(id){const s=id?S(id):{dept:'CSE'};modal(id?'Edit student':'Add student',[['name','Full name','',0,1],['roll','Roll number','',0,1],['dept','Department','select',DEPTS],['cgpa','CGPA','number',0,1],['email','Email','email'],['phone','Phone','tel'],['skills','Skills (comma separated)']],s,d=>{d.cgpa=+d.cgpa;if(d.cgpa<0||d.cgpa>10){toast('CGPA must be between 0 and 10');return false}
 if(db.students.some(x=>x.roll===d.roll&&x.id!==id)){toast('That roll number already exists');return false}
 id?Object.assign(S(id),d):db.students.push({id:uid('s'),...d});toast(id?'Student updated':'Student added')})}
function driveForm(id){const d0=id?D(id):{status:'Upcoming',depts:'All',date:iso(7),minCgpa:6};modal(id?'Edit drive':'Add recruitment drive',[['name','Company','',0,1],['role','Job role','',0,1],['ctc','Package (LPA)','number',0,1],['minCgpa','Minimum CGPA','number',0,1],['depts','Eligible departments (comma separated or All)'],['date','Drive date','date',0,1],['location','Location'],['status','Status','select',DST]],d0,d=>{d.ctc=+d.ctc;d.minCgpa=+d.minCgpa;id?Object.assign(D(id),d):db.drives.push({id:uid('d'),...d});toast(id?'Drive updated':'Drive added')})}
function appForm(){if(!db.students.length||!db.drives.length)return toast('Add a student and a drive first');
 modal('New application',[['sid','Student','select',db.students.map(s=>[s.id,`${s.name} (${s.dept}, ${s.cgpa})`])],['did','Drive','select',db.drives.map(d=>[d.id,`${d.name} – ${d.role}`])]],{},v=>{const s=S(v.sid),d=D(v.did);
  if(db.apps.some(a=>a.sid===v.sid&&a.did===v.did)){toast('Already applied to this drive');return false}
  if(!elig(s,d)){toast(`${s.name} is not eligible: needs CGPA ${d.minCgpa}+ in ${d.depts}`);return false}
  db.apps.push({id:uid('a'),sid:v.sid,did:v.did,status:'Applied'});toast('Application added')},'Apply')}
function intForm(){const ap=db.apps.filter(a=>['Applied','Shortlisted','Interview'].includes(a.status));if(!ap.length)return toast('No active applications to schedule');
 modal('Schedule interview',[['aid','Application','select',ap.map(a=>[a.id,`${S(a.sid)?.name} → ${D(a.did)?.name}`])],['date','Date','date',0,1],['time','Time','time',0,1],['mode','Mode','select',['Online','On campus']]],{date:iso(1),time:'10:00'},v=>{
  const clash=db.ints.find(i=>i.date===v.date&&i.time===v.time&&A(i.aid)?.sid===A(v.aid).sid);if(clash){toast('That student already has an interview at this time');return false}
  db.ints.push({id:uid('i'),...v});if(A(v.aid).status!=='Interview')A(v.aid).status='Interview';toast('Interview scheduled')},'Schedule')}
/* views */
const views={dash(){const P=placed(),tot=db.students.length,ct=P.map(s=>best(s.id).ctc),act=db.drives.filter(d=>d.status!=='Completed').length;
 const dep=DEPTS.map(d=>{const t=db.students.filter(s=>s.dept===d),p=t.filter(s=>best(s.id));return`<div class="bar"><span>${d}</span><div class="track"><div class="fill" style="width:${pct(p.length,t.length)}%"></div></div><b>${pct(p.length,t.length)}%</b></div>`}).join('');
 const col={Applied:'#b7c0e0',Shortlisted:'#8da0f5',Interview:'#5a73e8',Offered:'#2f4bd1',Rejected:'#e5484d'};
 const pal=['#2f4bd1','#5a73e8','#8da0f5','#b7c3fa','#1d2f8f','#6f86ff'];let acc=0;const seg=DEPTS.map((d,i)=>{const n=db.students.filter(s=>s.dept===d).length,a=acc;acc+=n;return[d,n,a,acc,pal[i]]}),q2=v=>tot?(v/tot*100).toFixed(2):0;
 const donut=`<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${seg.map(x=>`${x[4]} ${q2(x[2])}% ${q2(x[3])}%`).join(',')})"><div><b>${tot}</b><span>Students</span></div></div><div class="dleg">${seg.map(x=>`<div><i style="background:${x[4]}"></i>${x[0]}<b>${x[1]}</b></div>`).join('')}</div></div>`;
 const pipe=`<div class="stack">${AST.map(s=>{const n=db.apps.filter(a=>a.status===s).length;return`<div title="${s}" style="width:${pct(n,db.apps.length)}%;background:${col[s]}"></div>`}).join('')}</div><div class="legend">${AST.map(s=>`<span><i style="background:${col[s]}"></i>${s} ${db.apps.filter(a=>a.status===s).length}</span>`).join('')}</div>`;
 const top=P.map(s=>[s,best(s.id)]).sort((a,b)=>b[1].ctc-a[1].ctc).slice(0,5).map(([s,d])=>`<div class="row"><div class="who">${av(s.name)}<div>${esc(s.name)}<div class="meta">${s.dept} · CGPA ${s.cgpa}</div></div></div><div class="who">${lg(d.name)}<b>${d.ctc} LPA</b></div></div>`).join('')||'<div class="empty">No offers yet.</div>';
 const up=[...db.ints].filter(i=>i.date>=iso(0)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5).map(i=>{const a=A(i.aid);return a?`<div class="row"><div class="who">${av(S(a.sid)?.name)}<div>${esc(S(a.sid)?.name)}<div class="meta">${esc(D(a.did)?.name)} · ${i.mode}</div></div></div><div class="meta">${i.date}<br>${i.time}</div></div>`:''}).join('')||'<div class="empty">No interviews scheduled.</div>';
 const dr=[...db.drives].filter(d=>d.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(d=>`<div class="row"><div class="who">${lg(d.name)}<div>${esc(d.name)}<div class="meta">${esc(d.role)} · ${d.ctc} LPA</div></div></div>${tag(d.date,stc(d.status))}</div>`).join('')||'<div class="empty">No drives planned.</div>';
 return`<div class="hero"><div><h2>Placement overview</h2><p>Batch status across departments, drives and applications.</p></div><svg class="art" viewBox="0 0 360 170" preserveAspectRatio="xMaxYMax meet" aria-hidden="true"><circle cx="300" cy="44" r="24" fill="#e0a526" opacity=".95"/><g fill="#fff" opacity=".16"><rect x="170" y="80" width="44" height="90"/><rect x="220" y="52" width="40" height="118"/><rect x="266" y="92" width="48" height="78"/><rect x="320" y="70" width="40" height="100"/></g><g fill="#fff" opacity=".45"><rect x="178" y="92" width="8" height="8"/><rect x="196" y="92" width="8" height="8"/><rect x="178" y="112" width="8" height="8"/><rect x="230" y="66" width="8" height="8"/><rect x="244" y="66" width="8" height="8"/><rect x="230" y="88" width="8" height="8"/><rect x="276" y="106" width="8" height="8"/><rect x="294" y="106" width="8" height="8"/><rect x="330" y="84" width="8" height="8"/></g><path d="M80 70 130 48 180 70 130 92z" fill="#fff"/><path d="M104 82v22c0 9 52 9 52 0V82l-26 12z" fill="#fff" opacity=".8"/><path d="M174 73v34" stroke="#e0a526" stroke-width="3"/><circle cx="174" cy="110" r="5" fill="#e0a526"/><rect y="164" width="360" height="6" fill="#fff" opacity=".25"/></svg></div>
 <div class="kpis"><div class="kpi hero"><b>${pct(P.length,tot)}%</b><span>Placement rate</span></div><div class="kpi"><b>${P.length}/${tot}</b><span>Students placed</span></div><div class="kpi"><b>${act}</b><span>Active drives</span></div><div class="kpi"><b>${f1(avg(ct))}</b><span>Average LPA</span></div><div class="kpi"><b>${ct.length?Math.max(...ct):0}</b><span>Highest LPA</span></div></div>
 <div class="grid"><div class="card"><h3>Placement rate by department</h3>${dep}</div><div class="card"><h3>Total students</h3>${donut}</div></div><div class="grid"><div class="card"><h3>Application pipeline</h3>${pipe}<h3 style="margin-top:18px">Upcoming drives</h3>${dr}</div></div>
 <div class="grid"><div class="card"><h3>Top packages</h3>${top}</div><div class="card"><h3>Next interviews</h3>${up}</div></div>`},
students(){const q=ui.q.toLowerCase();let L=db.students.filter(s=>(!q||(s.name+s.roll+s.skills).toLowerCase().includes(q))&&(!ui.dept||s.dept===ui.dept)&&(!ui.st||(ui.st==='Placed')===!!best(s.id)));
 return`<div class="head"><div><h2>Students</h2><p>${L.length} of ${db.students.length} records</p></div><div class="tools"><button class="btn" data-act="csv">Copy CSV</button><button class="btn pri" data-act="addS">Add student</button></div></div>
 <div class="tools"><input id="q" type="search" placeholder="Search name, roll, skill" value="${esc(ui.q)}" aria-label="Search"><select id="dept" aria-label="Department"><option value="">All departments</option>${DEPTS.map(d=>`<option${ui.dept===d?' selected':''}>${d}</option>`).join('')}</select><select id="st" aria-label="Status"><option value="">Any status</option>${['Placed','Unplaced'].map(d=>`<option${ui.st===d?' selected':''}>${d}</option>`).join('')}</select></div>
 <div class="wrap"><table><tr><th>Student</th><th>Dept</th><th>CGPA</th><th>Applications</th><th>Status</th><th></th></tr>${L.map(s=>{const b=best(s.id);return`<tr><td><div class="who">${av(s.name)}<div>${esc(s.name)}<small>${esc(s.roll)} · ${esc(s.skills)}</small></div></div></td><td>${s.dept}</td><td>${s.cgpa}</td><td>${db.apps.filter(a=>a.sid===s.id).length}</td><td>${b?tag(`Placed · ${b.name} ${b.ctc} LPA`):tag('Unplaced','mute')}</td><td><button class="btn sm" data-act="editS" data-id="${s.id}">Edit</button> <button class="btn sm del" data-act="delS" data-id="${s.id}">Delete</button></td></tr>`}).join('')||''}</table>${L.length?'':'<div class="empty">No students match. Clear the filters or add a student.</div>'}</div>`},
drives(){return`<div class="head"><div><h2>Recruitment drives</h2><p>Companies, eligibility and applicant counts.</p></div><button class="btn pri" data-act="addD">Add drive</button></div>
 <div class="cards">${[...db.drives].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{const ap=db.apps.filter(a=>a.did===d.id),el=db.students.filter(s=>elig(s,d)).length;return`<div class="card" style="border-top:4px solid hsl(${hue(d.name)} 55% 45%)"><div class="row" style="border:0;padding:0"><div class="who">${lg(d.name)}<h3 style="margin:0">${esc(d.name)}</h3></div>${tag(d.status,stc(d.status))}</div><div class="meta">${esc(d.role)} · ${esc(d.location)}</div><p style="margin:10px 0 4px"><b>${d.ctc} LPA</b> · ${d.date}</p><div class="meta">Min CGPA ${d.minCgpa} · ${esc(d.depts)}<br>${el} eligible · ${ap.length} applied · ${ap.filter(a=>a.status==='Offered').length} offers</div><div class="acts"><button class="btn sm" data-act="editD" data-id="${d.id}">Edit</button><button class="btn sm del" data-act="delD" data-id="${d.id}">Delete</button></div></div>`}).join('')||'<div class="empty">No drives yet.</div>'}</div>`},
apps(){const L=db.apps.filter(a=>(!ui.drv||a.did===ui.drv)&&(!ui.ast||a.status===ui.ast));
 return`<div class="head"><div><h2>Applications</h2><p>Move candidates through the hiring pipeline.</p></div><button class="btn pri" data-act="addA">New application</button></div>
 <div class="tools"><select id="drv" aria-label="Drive"><option value="">All drives</option>${db.drives.map(d=>`<option value="${d.id}"${ui.drv===d.id?' selected':''}>${esc(d.name)}</option>`).join('')}</select><select id="ast" aria-label="Stage"><option value="">All stages</option>${AST.map(d=>`<option${ui.ast===d?' selected':''}>${d}</option>`).join('')}</select></div>
 <div class="wrap"><table><tr><th>Student</th><th>Drive</th><th>Stage</th><th></th></tr>${L.map(a=>`<tr><td><div class="who">${av(S(a.sid)?.name)}<div>${esc(S(a.sid)?.name)}<small>${S(a.sid)?.dept} · CGPA ${S(a.sid)?.cgpa}</small></div></div></td><td><div class="who">${lg(D(a.did)?.name)}<div>${esc(D(a.did)?.name)}<small>${esc(D(a.did)?.role)} · ${D(a.did)?.ctc} LPA</small></div></div></td><td><select data-act="stage" data-id="${a.id}" aria-label="Stage">${AST.map(s=>`<option${a.status===s?' selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn sm del" data-act="delA" data-id="${a.id}">Remove</button></td></tr>`).join('')}</table>${L.length?'':'<div class="empty">No applications in this view.</div>'}</div>`},
ints(){const L=[...db.ints].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),t=iso(0);
 return`<div class="head"><div><h2>Interview schedule</h2><p>${L.filter(i=>i.date>=t).length} upcoming</p></div><button class="btn pri" data-act="addI">Schedule interview</button></div>
 <div class="wrap"><table><tr><th>When</th><th>Student</th><th>Company</th><th>Mode</th><th></th></tr>${L.map(i=>{const a=A(i.aid);return`<tr><td>${i.date}<small>${i.time}${i.date<t?' · past':i.date===t?' · today':''}</small></td><td><div class="who">${av(S(a?.sid)?.name)}${esc(S(a?.sid)?.name)}</div></td><td><div class="who">${lg(D(a?.did)?.name)}${esc(D(a?.did)?.name)}</div></td><td>${tag(i.mode,'mute')}</td><td><button class="btn sm del" data-act="delI" data-id="${i.id}">Cancel</button></td></tr>`}).join('')}</table>${L.length?'':'<div class="empty">No interviews scheduled yet.</div>'}</div>`},
reports(){const rows=DEPTS.map(d=>{const t=db.students.filter(s=>s.dept===d),p=t.filter(s=>best(s.id));return`<tr><td>${d}</td><td>${t.length}</td><td>${p.length}</td><td>${pct(p.length,t.length)}%</td><td>${f1(avg(p.map(s=>best(s.id).ctc)))}</td></tr>`}).join('');
 const rec=db.drives.map(d=>[d.name,db.apps.filter(a=>a.did===d.id&&a.status==='Offered').length,d.ctc]).sort((a,b)=>b[1]-a[1]);
 const ct=placed().map(s=>best(s.id).ctc),bands=[['Below 5',x=>x<5],['5 – 10',x=>x>=5&&x<10],['10 – 20',x=>x>=10&&x<20],['20 and above',x=>x>=20]];
 const un=db.students.filter(s=>!best(s.id)).length,sorted=[...ct].sort((a,b)=>a-b),med=sorted.length?sorted[Math.floor(sorted.length/2)]:0;
 return`<div class="head"><div><h2>Placement statistics</h2><p>${un} students still unplaced · median package ${f1(med)} LPA</p></div></div>
 <div class="grid"><div class="card"><h3>Department summary</h3><div class="wrap" style="border:0"><table style="min-width:0"><tr><th>Dept</th><th>Total</th><th>Placed</th><th>Rate</th><th>Avg LPA</th></tr>${rows}</table></div></div>
 <div class="card"><h3>Offers by recruiter</h3>${rec.map(r=>`<div class="row"><span>${esc(r[0])}</span><span class="meta">${r[2]} LPA</span><b>${r[1]} offers</b></div>`).join('')}<h3 style="margin-top:18px">Package bands</h3>${bands.map(b=>{const n=ct.filter(b[1]).length;return`<div class="bar"><span>${b[0]}</span><div class="track"><div class="fill" style="width:${pct(n,ct.length)}%;background:var(--acc2)"></div></div><b>${n}</b></div>`}).join('')}</div></div>`}};
const NAV=[['dash','Dashboard'],['students','Students'],['drives','Drives'],['apps','Applications'],['ints','Interviews'],['reports','Reports']];
function render(){$('#nav').innerHTML=`<div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9zM5 13.2v4c0 1.7 3.1 3.3 7 3.3s7-1.6 7-3.3v-4l-7 3.8z"/></svg>Place<i>Desk</i></div><p class="sec">Platform</p>`+NAV.map(([k,l])=>`<button data-nav="${k}" class="${ui.v===k?'on':''}"${ui.v===k?' aria-current="page"':''}>${IC[k]}${l}</button>`).join('')+`<p class="sec">Help</p><button data-act="reset">${IC.reset}Reset demo data</button>`;$('#main').innerHTML=topbar()+views[ui.v]();$('#main').className=ui.go?'go':'';if(ui.go){fx();ui.go=false}}
const prof=()=>({name:'Placement Cell',role:'Placement Officer',email:'placement@campus.edu',...db.profile});
function profForm(){modal('Edit profile',[['name','Your name','',0,1],['role','Role'],['email','Email','email']],prof(),d=>{d.name=d.name.trim();if(!d.name){toast('Enter your name');return false}db.profile=d;toast('Profile saved')},'Save profile')}
function topbar(){const P=prof(),n=db.ints.filter(i=>i.date>=iso(0)).length,l=NAV.find(x=>x[0]===ui.v)[1];
 return`<div class="top"><label class="gs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><input id="gs" type="search" placeholder="Search students across the dashboard" value="${esc(ui.q)}" aria-label="Search students"></label><button class="bell" data-nav="ints" aria-label="${n} upcoming interviews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>${n?`<i>${n}</i>`:''}</button><button class="me" data-act="prof" aria-label="Edit profile">${av(P.name)}<div><b>${esc(P.name)}</b><small>${esc(P.role||P.email)}</small></div></button></div><div class="crumb">Dashboard <span>›</span> ${l}</div>`}
function fx(){document.querySelectorAll('#main .kpi,#main .card,#main tr,#main .row').forEach(e=>e.style.setProperty('--i',Math.min(10,[...e.parentNode.children].indexOf(e))));
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 document.querySelectorAll('.kpi b').forEach(b=>{const m=b.textContent.match(/^(\d+(?:\.\d+)?)(.*)$/);if(!m)return;const to=+m[1],dec=(m[1].split('.')[1]||'').length,t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0-150)/900),e=1-Math.pow(1-Math.max(p,0),3);b.textContent=(to*e).toFixed(dec)+m[2];if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function rerender(){const f=document.activeElement?.id;render();if(f){const e=document.getElementById(f);if(e){e.focus();try{e.setSelectionRange(1e3,1e3)}catch(x){}}}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){ui.v=n.dataset.nav;ui.go=true;render();window.scrollTo(0,0);return}
 const b=e.target.closest('button[data-act]');if(!b)return;const id=b.dataset.id,m={addS:()=>studentForm(),editS:()=>studentForm(id),addD:()=>driveForm(),editD:()=>driveForm(id),addA:appForm,addI:intForm,prof:profForm,reset:()=>ask('Restore the sample data? Your changes will be lost.',()=>{const p=db.profile;db=seed();if(p)db.profile=p},'Restore'),
 delS:()=>ask('Delete this student and their applications?',()=>{const ids=db.apps.filter(a=>a.sid===id).map(a=>a.id);db.apps=db.apps.filter(a=>a.sid!==id);db.ints=db.ints.filter(i=>!ids.includes(i.aid));db.students=db.students.filter(s=>s.id!==id)}),
 delD:()=>ask('Delete this drive and its applications?',()=>{const ids=db.apps.filter(a=>a.did===id).map(a=>a.id);db.apps=db.apps.filter(a=>a.did!==id);db.ints=db.ints.filter(i=>!ids.includes(i.aid));db.drives=db.drives.filter(d=>d.id!==id)}),
 delA:()=>ask('Remove this application?',()=>{db.apps=db.apps.filter(a=>a.id!==id);db.ints=db.ints.filter(i=>i.aid!==id)}),delI:()=>ask('Cancel this interview?',()=>{db.ints=db.ints.filter(i=>i.id!==id)}),
 csv:()=>{const c=['Name,Roll,Dept,CGPA,Email,Status',...db.students.map(s=>[s.name,s.roll,s.dept,s.cgpa,s.email,best(s.id)?'Placed':'Unplaced'].join(','))].join('\n');
  (navigator.clipboard?.writeText(c)||Promise.reject()).then(()=>toast('Student list copied as CSV'),()=>toast('Copy was blocked by the browser'))}};m[b.dataset.act]?.()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'||t.id==='gs'){ui.q=t.value;if(t.id==='gs'&&t.value&&ui.v!=='students')ui.v='students';rerender()}});
document.addEventListener('change',e=>{const t=e.target;if(['dept','st','drv','ast'].includes(t.id)){ui[t.id]=t.value;rerender()}
 if(t.dataset.act==='stage'){A(t.dataset.id).status=t.value;if(t.value==='Rejected')db.ints=db.ints.filter(i=>i.aid!==t.dataset.id);save();render();toast('Stage updated to '+t.value)}});
render();
</script></body></html>
